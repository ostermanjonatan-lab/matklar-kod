<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded App Icon Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Cooking Pot & Chef Icon Graphic -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Pot Body -->
    <path d="M120 250 C120 370 200 420 256 420 C312 420 392 370 392 250 Z" fill="#ffffff"/>
    
    <!-- Pot Handles -->
    <path d="M96 260 C75 260 75 300 96 300 L120 290 L120 270 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M416 260 C437 260 437 300 416 300 L392 290 L392 270 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Pot Lid / Rim -->
    <rect x="104" y="230" width="304" height="26" rx="13" fill="#ecfdf5"/>

    <!-- Steam Waves -->
    <path d="M190 190 Q175 160 195 130 Q215 100 190 75" fill="none" stroke="#a7f3d0" stroke-width="14" stroke-linecap="round"/>
    <path d="M256 180 Q240 150 260 120 Q280 90 256 65" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M322 190 Q305 160 325 130 Q345 100 322 75" fill="none" stroke="#a7f3d0" stroke-width="14" stroke-linecap="round"/>

    <!-- Heart in Center of Pot -->
    <path d="M256 345 C256 345 220 310 220 285 C220 270 232 260 246 260 C253 260 256 265 256 265 C256 265 259 260 266 260 C280 260 292 270 292 285 C292 310 256 345 256 345 Z" fill="#047857"/>
  </g>
</svg>
