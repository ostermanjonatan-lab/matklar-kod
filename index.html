<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#284235" />
    <script>
      // Dark or light before the app starts, so the page does not flash light (see src/utils/theme.ts)
      try {
        var t = localStorage.getItem('matklar_theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1B1916');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Matklar – Mobilanpassad recept- och matplaneringsapp för hela hushållet." />
    
    <!-- Google Fonts: Fraunces (Editorial Serif) & Plus Jakarta Sans (Clean Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Apple iOS Native PWA & Standalone Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Matklar" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="mask-icon" href="/icon.svg" color="#284235" />

    <!-- Microsoft & Android Native PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Matklar" />
    <meta name="msapplication-TileColor" content="#284235" />

    <title>Matklar – Recept & Veckoplan</title>
  </head>
  <body class="bg-[#FCFAF5] text-[#1A1816] antialiased select-none font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
