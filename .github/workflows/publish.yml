# Bygger appen och lägger den i repot Matklar:
# - main publiceras på matklar.vercel.app
# - gh-pages publiceras på ostermanjonatan-lab.github.io/Matklar
name: Publicera appen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Kontrollera att nycklarna finns
        env:
          PUBLISH_TOKEN: ${{ secrets.MATKLAR_PUBLISH_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Utan Supabase-nycklarna skulle appen förlora kopplingen till hushållen
          if [ -z "$PUBLISH_TOKEN" ] || [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Lägg in MATKLAR_PUBLISH_TOKEN, VITE_SUPABASE_URL och VITE_SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci

      - name: Bygg appen
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Lägg appen i Matklar
        env:
          PUBLISH_TOKEN: ${{ secrets.MATKLAR_PUBLISH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898583+github-actions[bot]@users.noreply.github.com"
          version=$(node -p "require('./package.json').version")
          for branch in main gh-pages; do
            target="$RUNNER_TEMP/matklar-$branch"
            git clone --depth 1 --branch "$branch" "https://x-access-token:${PUBLISH_TOKEN}@github.com/ostermanjonatan-lab/Matklar.git" "$target"
            # Gamla filer i assets behålls så att öppna flikar kan ladda klart
            cp -r dist/. "$target/"
            touch "$target/.nojekyll"
            git -C "$target" add -A
            if git -C "$target" diff --cached --quiet; then
              echo "Inget nytt att publicera på $branch"
            else
              git -C "$target" commit -m "Publicera version $version ($GITHUB_SHA)"
              git -C "$target" push origin "$branch"
            fi
          done
